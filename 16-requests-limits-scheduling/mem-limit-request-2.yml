apiVersion: v1
kind: Pod
metadata:
  name: memory-demo-2
  namespace: mem-example
spec:
  containers:
  - name: memory-demo-2ctr
    image: polinux/stress
    resources:
      requests:
        memory: "50Mi"
      limits:
        memory: "100Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]  

# This pod will be scheduled because the memory request is less than the node capacity.
# but in the agrs we are asking for 250M memory which is more than the limit, 
# so the container will be killed by the kubelet and restarted again and again until the pod is deleted.